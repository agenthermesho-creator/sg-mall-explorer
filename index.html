<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fbfaf6;--bg-soft:#f4f1e8;--surface:#fff;--surface-2:#f6f3ea;--border:rgba(60,45,20,.12);--border-strong:rgba(60,45,20,.24);--text-1:#2a2418;--text-2:#5a5140;--text-3:#8a7f68;--accent:#2d7d6e;--accent-2:#d88a3a;--accent-3:#c4593f;--radius:14px;--radius-lg:20px;--shadow:0 12px 30px rgba(60,45,20,.07);--shadow-lg:0 20px 48px rgba(60,45,20,.1)}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased;padding:0 0 60px}
.header{padding:24px 40px 6px;max-width:1400px;margin:0 auto}
.header h1{font-family:'Playfair Display',serif;font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.05;display:inline}
.header .gen-time{font-family:'Inter',sans-serif;font-size:11px;font-weight:400;color:var(--text-3);margin-left:10px;letter-spacing:0}
.loc-chips{max-width:1400px;margin:0 auto;padding:6px 40px 2px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.loc-chips::-webkit-scrollbar{height:3px}
.loc-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.loc-chip{display:inline-flex;flex-direction:column;padding:8px 16px 7px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s ease;user-select:none;margin-right:6px;vertical-align:top;line-height:1.2}
.loc-chip:hover{border-color:var(--accent);color:var(--accent)}
.loc-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.loc-chip .loc-name{font-weight:700;font-size:14px}
.loc-chip .loc-count{display:inline-block;margin-top:2px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:600;background:var(--bg-soft);color:var(--text-3);align-self:flex-start}
.loc-chip.active .loc-count{background:rgba(255,255,255,.2);color:#fff}
.cat-chips{max-width:1400px;margin:0 auto;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:6px 40px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.cat-chips::-webkit-scrollbar{height:4px}
.cat-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chip{display:inline-block;padding:5px 13px;border-radius:999px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s ease;user-select:none;margin-right:4px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .num{display:inline-block;margin-left:3px;padding:0 4px;border-radius:4px;font-size:10px;font-weight:600;background:var(--bg-soft);color:var(--text-3);transition:all .2s}
.chip.active .num{background:rgba(255,255,255,.2);color:#fff}
.cards-grid{padding:12px 40px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;display:none}
.card.visible{display:block}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card .type-badge{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2);margin-bottom:4px}
.card h3{font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:2px;line-height:1.3}
.card .address{font-size:11px;color:var(--text-3);margin-bottom:3px;line-height:1.3}
.card .rating{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--text-2);margin-bottom:0}
.card .rating .star{color:#e8a020}
.card .rating .num-reviews{color:var(--text-3);font-size:10px}
.card .map-link{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:11px;font-weight:500;text-decoration:none;transition:background .2s;margin-top:6px}
.card .map-link:hover{background:var(--accent-2)}
.card .map-link svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty-state{display:none;text-align:center;padding:60px 20px;color:var(--text-3);grid-column:1/-1}
.empty-state.show{display:block}
.empty-state h3{font-family:'Playfair Display',serif;font-size:24px;color:var(--text-2);margin-bottom:6px}
.empty-state p{font-size:14px}
@media(max-width:720px){.header{padding:18px 16px 4px}.loc-chips,.cat-chips{padding:4px 16px 6px}.cards-grid{padding:8px 16px;grid-template-columns:1fr}.header h1{font-size:30px}.header .gen-time{display:block;margin-left:0;margin-top:2px}}
</style>
</head>

var CATEGORIES = {
  "Fashion":["clothing_store","shoe_store","jewelry_store","department_store","sporting_goods_store","sportswear_store","womens_clothing_store","bag_shop","accessory_store","tailor"],
  "Food & Drink":["restaurant","fast_food_restaurant","cafe","coffee_shop","dessert_shop","ice_cream_shop","bakery","food_court","meal_takeaway","meal_delivery","deli","sandwich_shop","donut_shop","pizza_restaurant","hamburger_restaurant","sushi_restaurant","ramen_restaurant"],
  "Electronics & Tech":["electronics_store","computer_store","mobile_phone_store","cell_phone_store","video_game_store","appliance_store"],
  "Home & Furniture":["furniture_store","home_goods_store","hardware_store","home_improvement_store","building_materials_store"],
  "Books & Gifts":["book_store","gift_shop","toy_store","stationery_store","florist","candy_store","chocolate_shop"],
  "Health & Beauty":["beauty_salon","hair_salon","nail_salon","massage","spa","cosmetics_store","drugstore","pharmacy","skin_care_clinic","barber_shop","tanning_studio","wellness_center"],
  "Entertainment":["movie_theater","bowling_alley","video_arcade","karaoke","amusement_center","indoor_playground","arcade"],
  "Fitness":["gym","fitness_center","yoga_studio","health"],
  "Services":["bank","atm","laundry","dry_cleaning","tailor","repair_service","shipping_service","courier_service","post_office","travel_agency","optician","key_cutter"],
  "Groceries":["supermarket","convenience_store","grocery_store","hypermarket","wholesaler","butcher_shop","fish_store","organic_store","health_food_store"],
};
var CAT_NAMES = Object.keys(CATEGORIES);
var currentMallIdx = 0;

function getStores() {
  return MALLS[currentMallIdx].st || [];
}

function catCount(ct) {
  return getStores().filter(function(s) { return ct.indexOf(s.t) >= 0; }).length;
}

function tl(t) {
  return t.replace(/_/g, ' ').replace(/\b\w/g, function(c){return c.toUpperCase();});
}

// Mall chips
var lc = document.getElementById('locChips');
var first = true;
MALLS.forEach(function(m, i) {
  var c = document.createElement('span');
  c.className = 'loc-chip' + (first ? ' active' : '');
  c.dataset.idx = i;
  c.innerHTML = '<span class="loc-name">' + m.n + '</span><span class="loc-count">' + m.st.length + ' stores</span>';
  lc.appendChild(c);
  first = false;
});

setTimeout(function() {
  var chips = document.querySelectorAll('.loc-chip');
  var maxW = 0;
  chips.forEach(function(c) { c.style.minWidth = ''; maxW = Math.max(maxW, c.offsetWidth); });
  chips.forEach(function(c) { c.style.minWidth = maxW + 'px'; });
}, 0);

var cc = document.getElementById('catChips');
var grid = document.getElementById('grid');

function buildChips() {
  cc.innerHTML = '';
  var a = document.createElement('span');
  a.className = 'chip active'; a.textContent = 'All Stores'; a.dataset.cat = '__all__';
  cc.appendChild(a);
  CAT_NAMES.forEach(function(cn) {
    var n = catCount(CATEGORIES[cn]);
    if (n === 0) return;
    var c = document.createElement('span');
    c.className = 'chip'; c.dataset.cat = cn;
    c.innerHTML = cn + ' <span class="num">' + n + '</span>';
    cc.appendChild(c);
  });
}

function renderCards() {
  grid.innerHTML = '';
  var active = new Set();
  document.querySelectorAll('#catChips .chip.active:not([data-cat="__all__"])').forEach(function(c){active.add(c.dataset.cat);});
  var allMode = document.querySelector('#catChips [data-cat="__all__"]') && document.querySelector('#catChips [data-cat="__all__"]').classList.contains('active');
  var stores = getStores();
  var shown = 0;
  stores.forEach(function(s) {
    if (!allMode) {
      var match = false;
      active.forEach(function(c) { if (CATEGORIES[c].indexOf(s.t) >= 0) match = true; });
      if (!match) return;
    }
    shown++;
    var card = document.createElement('div'); card.className = 'card visible';
    var stars = '';
    for (var i=0;i<Math.max(1,Math.round(s.r||0));i++) stars += '&#9733;';
    var rt = s.r ? '<div class="rating"><span class="star">' + stars + '</span> ' + s.r + ' <span class="num-reviews">(' + s.rv.toLocaleString() + ')</span></div>' : '';
    var inCat = false; CAT_NAMES.forEach(function(c){if(CATEGORIES[c].indexOf(s.t)>=0)inCat=true;});
    var uc = inCat ? '' : ' <span style="font-size:9px;color:var(--text-3);background:var(--bg-soft);padding:1px 6px;border-radius:5px;margin-left:4px">other</span>';
    card.innerHTML = '<div class="type-badge">' + tl(s.t) + uc + '</div><h3>' + s.n + '</h3><div class="address">' + s.a + '</div>' + rt + '<a class="map-link" href="' + s.u + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21C16 17 20 13.4183 20 10a8 8 0 1 0-16 0c0 3.4183 4 7 8 11z"/></svg> View on Maps</a>';
    grid.appendChild(card);
  });
  var em = document.querySelector('.empty-state');
  if (!em) { em = document.createElement('div'); em.className = 'empty-state'; em.innerHTML = '<h3>No matches</h3><p>Try a different category</p>'; grid.appendChild(em); }
  em.classList.toggle('show', shown === 0);
}

lc.addEventListener('click', function(e) {
  var c = e.target.closest('.loc-chip');
  if (!c || c.classList.contains('active')) return;
  document.querySelectorAll('.loc-chip').forEach(function(x){x.classList.remove('active');});
  c.classList.add('active');
  currentMallIdx = parseInt(c.dataset.idx);
  buildChips();
  renderCards();
});

cc.addEventListener('click', function(e) {
  var c = e.target.closest('.chip');
  if (!c) return;
  if (c.dataset.cat === '__all__') { document.querySelectorAll('#catChips .chip').forEach(function(x){x.classList.remove('active');}); c.classList.add('active'); }
  else {
    var ae = document.querySelector('#catChips [data-cat="__all__"]');
    if (ae) ae.classList.remove('active');
    c.classList.toggle('active');
    if (!document.querySelector('#catChips .chip.active:not([data-cat="__all__"])') && ae) ae.classList.add('active');
  }
  renderCards();
});

buildChips();
renderCards();
</script>
